name: Tram_Kien
description: Cổng thông tin sinh viên HAU
publish_to: 'none'
version: 1.0.6+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  material_symbols_icons: ^4.2719.1
  flutter_math_fork: ^0.7.2
  scrollable_positioned_list: ^0.3.8

  # HTTP & parsing
  http: ^1.1.0
  beautiful_soup_dart: ^0.3.0
  html: ^0.15.4

  # Local storage
  sqflite: ^2.4.2
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  android_intent_plus: ^5.0.0
  workmanager: ^0.9.0
  background_fetch: ^1.2.1

  # State management
  provider: ^6.1.1

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  mailer: ^6.1.0
  # Splash Screen
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  assets:
    - assets/qrcode_itsvantruongg.github.io.png
    - assets/logo.png
    - assets/splash_logo_pre12.png
    - assets/splash_logo_android12.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_logo_pre12.png
  ios: true
  android_12:
    image: assets/splash_logo_android12.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

